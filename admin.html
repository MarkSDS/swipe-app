<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docenten Paneel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #333; color: white; text-align: center; }
        button { width: 100%; padding: 15px; margin-bottom: 15px; font-size: 1.2rem; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .nav-btn { background: #2ecc71; }
        .danger { background: #e74c3c; margin-top: 30px; }
        #huidige-stelling { background: #2c3e50; padding: 20px; border-radius: 5px; margin-bottom: 15px; font-size: 1.1rem; font-weight: bold; min-height: 40px; }
        #volgende-preview { background: #1a252f; padding: 10px; border-radius: 5px; margin-bottom: 25px; font-size: 0.9rem; color: #bdc3c7; font-style: italic; }
    </style>
</head>
<body>
    <h2>Quiz Control</h2>
    <div id="huidige-stelling">Verbinden met Google Sheet...</div>
    
    <!-- Hier komt de preview -->
    <div id="volgende-preview">Volgende: <span id="volgende-tekst">...</span></div>

    <button class="nav-btn" onclick="stuurActie('volgende')">Volgende Stelling ➡️</button>
    <button onclick="stuurActie('vorige')">⬅️ Vorige</button>
    
    <button class="danger" onclick="stuurActie('reset_naar_start')">🔄 Terug naar Vraag 1</button>

    <script>
        // PLAK HIER JOUW URL:
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDXETYP42iUOqla0EubIqcQ6c_RiOhNnu_Z41QlkMzk_dPIfgJ4BedRjT6yfoHmvV90Q/exec"; 

        function stuurActie(actie) {
            document.getElementById('huidige-stelling').innerText = "Laden...";
            
            fetch(WEB_APP_URL + "?actie=" + actie)
                .then(response => response.json())
                .then(data => {
                    // Update huidige vraag
                    document.getElementById('huidige-stelling').innerText = 
                        "Rij " + data.rij + ": " + data.stelling;
                        
                    // Update preview voor de volgende vraag (of toon een melding als de lijst leeg is)
                    document.getElementById('volgende-tekst').innerText = 
                        data.volgendeStelling ? data.volgendeStelling : "Einde van de lijst bereikt!";
                })
                .catch(error => alert("Oeps, fout: " + error));
        }

        stuurActie('status');
    </script>
</body>
</html>
